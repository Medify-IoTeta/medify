spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medify}
spring.datasource.username=${DB_USERNAME:medify_user}
spring.datasource.password=${DB_PASSWORD:medify_pass}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# Grace period between an intake going DISPENSED and it being swept to INCOMPLETE
# if the IR sensor never confirms the compartment emptied. Single source of truth
# for this value today; the plan is to eventually make it a per-user setting
# exposed in the app instead of a global default.
medify.intake.incomplete-grace-minutes=${INTAKE_INCOMPLETE_GRACE_MINUTES:30}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=always