spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medify}
spring.datasource.username=${DB_USERNAME:medify_user}
spring.datasource.password=${DB_PASSWORD:medify_pass}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never